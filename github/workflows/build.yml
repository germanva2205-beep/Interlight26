name: Build InterLight APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Фиксируем Java 17 для избежания конфликтов
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Nuke old Android structure
        # Жестко удаляем ВСЁ, что связано с android, чтобы создать с нуля
        run: |
          rm -rf android
          rm -f pubspec.lock
          
      - name: Generate fresh project
        # Создаем новый проект, который перезапишет lib/main.dart, но создаст правильный android
        run: flutter create --platforms=android --org com.germanva .
        
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release --no-shrink
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: interlight-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
